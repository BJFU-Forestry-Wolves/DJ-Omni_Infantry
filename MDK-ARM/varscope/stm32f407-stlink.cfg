# VarScope / OpenOCD config
# Target : STM32F407IGHx  (gimbal_task)  /  STM32F407ZGTx (gc_chass)
# Probe  : ST-Link V2 / V2-1 / V3  (SWD)
#
# Usage  : VarScope -> "cfg" field -> select this file
# Note   : ASCII only on purpose, so OpenOCD/Tcl never trips on encoding.

source [find interface/stlink.cfg]
transport select hla_swd

source [find target/stm32f4x.cfg]

# 4 MHz is a safe SWD clock; raise to 8000/12000 only if your wiring is short.
adapter speed 4000

# Reset: only the nRST line, do not gate it, so the core can still be halted.
reset_config srst_only srst_nogate
